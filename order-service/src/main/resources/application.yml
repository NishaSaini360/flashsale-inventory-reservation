server:
  port: 8083

spring:
  application:
    name: order-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/order_db}
    username: ${DB_USER:ord_user}
    password: ${DB_PASSWORD:ord_pass}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

app:
  jwt:
    secret: ${JWT_SECRET:change-me-local-dev-secret-at-least-32-bytes-long}
  inventory:
    base-url: ${INVENTORY_BASE_URL:http://localhost:8081}
  reservation:
    base-url: ${RESERVATION_BASE_URL:http://localhost:8082}
  http:
    connect-timeout-ms: 1000
    read-timeout-ms: 2000
  payment:
    mode: ${PAYMENT_MODE:RANDOM}
    min-delay-ms: 0
    max-delay-ms: 5000
    success-rate: 0.8
    callback-url: ${PAYMENT_CALLBACK_URL:http://localhost:8083}

logging:
  level:
    org.flywaydb: INFO
