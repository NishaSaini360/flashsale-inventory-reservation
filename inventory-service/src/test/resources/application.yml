spring:
  datasource:
    url: ${TEST_DB_URL:jdbc:postgresql://localhost:5432/inventory_db}
    username: ${TEST_DB_USER:inv_user}
    password: ${TEST_DB_PASSWORD:inv_pass}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    clean-disabled: false

app:
  jwt:
    secret: test-secret-that-is-at-least-32-bytes-long!
  sweeper:
    interval-ms: 3600000
