server:
  port: 8082

spring:
  application:
    name: reservation-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/reservation_db}
    username: ${DB_USER:res_user}
    password: ${DB_PASSWORD:res_pass}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

app:
  jwt:
    secret: ${JWT_SECRET:change-me-local-dev-secret-at-least-32-bytes-long}
  reservation:
    ttl: ${RESERVATION_TTL:PT10M}
    allocation-grace: ${ALLOCATION_GRACE:PT2M}
  inventory:
    base-url: ${INVENTORY_BASE_URL:http://localhost:8081}
    connect-timeout-ms: 1000
    read-timeout-ms: 2000
  expiry:
    interval-ms: ${EXPIRY_INTERVAL_MS:2000}
    batch-size: 100

logging:
  level:
    org.flywaydb: INFO
